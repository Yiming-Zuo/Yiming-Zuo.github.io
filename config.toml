title = "Yiming Zuo"
baseURL = "https://yiming-zuo.github.io/"
theme = "researcher"
locale = "en"
defaultContentLanguage = "en"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[params]
  author = "Yiming Zuo"
  description = "Yiming Zuo develops generative transport methods for molecular sampling, free-energy estimation, and molecular design."
  lang = "en"
  math = false

  [params.footer]
    text = "Built with Hugo Researcher"
    url = "https://github.com/ojroques/hugo-researcher"

  [params.style]
    fontFamily = "Avenir, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif"
    fontSize = "14pt"
    pageWidth = "750px"
    avatarSize = "200px"
    colorBlack = "#222222"
    colorRed = "#107896"

[menu]
  [[menu.main]]
    name = "*"
    url = "/"
    weight = 1

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
